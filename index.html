<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>*{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}</style>
<style>
  /* Layout concept: phone-first, sea-blue hero with a wave edge, chunky outlined cards with hard shadows, one colour per day and per tab, 7-tab bottom bar (top bar on desktop) */
  :root {
    --bg: #e6f6fa;
    --surface: #ffffff;
    --surface-2: #f0fafc;
    --ink: #10303a;
    --muted: #4b6872;
    --line: #c9e3ea;
    --edge: #10303a;
    --hero-bg: #0a8aa0;
    --hero-ink: #ffffff;
    --primary: #0a7d92;
    --primary-ink: #ffffff;
    --primary-soft: #d2f0f6;
    --coral: #ff6a58;  --coral-soft: #ffe0db;
    --sun: #ffc92e;    --sun-soft: #fff0c2;
    --mint: #2fd39a;   --mint-soft: #d3f7e8;
    --pink: #ff86bd;   --pink-soft: #ffdfee;
    --sky: #4aa8ff;    --sky-soft: #d9ecff;
    --time: #c4301d;
    --ok: #137a54;   --ok-soft: #d3f7e8;
    --warn: #7d4a00; --warn-soft: #fff0c2;
    --bad: #b3261e;  --bad-soft: #ffe0db;
    --naver: #03c75a; --naver-ink: #05230f;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --num: "Fredoka", ui-rounded, "Noto Sans TC", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1c22; --surface: #12303a; --surface-2: #183b47; --ink: #e8f4f7; --muted: #9ab9c2; --line: #28505e; --edge: #4a8696;
      --hero-bg: #0f4f5e; --hero-ink: #e8f4f7; --primary: #6fd0e6; --primary-ink: #08222b; --primary-soft: #1b4856;
      --coral: #ff8576; --coral-soft: #4a2723; --sun: #ffd24d; --sun-soft: #46391a; --mint: #4fe0b0; --mint-soft: #17463a;
      --pink: #ff9ccb; --pink-soft: #482a3b; --sky: #74bcff; --sky-soft: #1d3a56; --time: #ff9a86;
      --ok: #6fe0b2; --ok-soft: #17463a; --warn: #ffd98a; --warn-soft: #46391a; --bad: #ff9a90; --bad-soft: #4a2723;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1c22; --surface: #12303a; --surface-2: #183b47; --ink: #e8f4f7; --muted: #9ab9c2; --line: #28505e; --edge: #4a8696;
    --hero-bg: #0f4f5e; --hero-ink: #e8f4f7; --primary: #6fd0e6; --primary-ink: #08222b; --primary-soft: #1b4856;
    --coral: #ff8576; --coral-soft: #4a2723; --sun: #ffd24d; --sun-soft: #46391a; --mint: #4fe0b0; --mint-soft: #17463a;
    --pink: #ff9ccb; --pink-soft: #482a3b; --sky: #74bcff; --sky-soft: #1d3a56; --time: #ff9a86;
    --ok: #6fe0b2; --ok-soft: #17463a; --warn: #ffd98a; --warn-soft: #46391a; --bad: #ff9a90; --bad-soft: #4a2723;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .ic { width: 20px; height: 20px; flex: none; }
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }

  .dc0 { --dc: var(--coral); --dcs: var(--coral-soft); }
  .dc1 { --dc: var(--sun);   --dcs: var(--sun-soft); }
  .dc2 { --dc: #35c4d9;      --dcs: var(--primary-soft); }
  .dc3 { --dc: var(--mint);  --dcs: var(--mint-soft); }
  .dc4 { --dc: var(--pink);  --dcs: var(--pink-soft); }

  /* ---------- Hero ---------- */
  .hero { position: relative; background: var(--hero-bg); color: var(--hero-ink); padding: 18px 0 40px; overflow: hidden; }
  .hero::before { content: ""; position: absolute; right: -18px; top: -22px; width: 92px; height: 92px; border-radius: 50%; background: var(--sun); opacity: .95; }
  .hero::after { content: ""; position: absolute; left: 52%; top: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--coral); }
  .hero .wave { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 24px; display: block; }
  .hero-in { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding-inline: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hero h1 { font-family: var(--num); font-size: 32px; font-weight: 700; letter-spacing: .01em; line-height: 1.1; }
  .hero .sub { font-size: 13px; margin-top: 4px; opacity: .92; }
  .mode { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--edge); background: #fff; color: #10303a; border-radius: 999px;
    padding: 6px 13px 6px 10px; font-size: 13px; font-weight: 700; box-shadow: 0 3px 0 var(--edge); }
  .mode[aria-pressed="true"] { background: var(--sun); }
  .mode:disabled { opacity: .85; box-shadow: none; cursor: default; }
  .mode:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }

  /* ---------- Shell + tabs ---------- */
  .shell { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 104px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
    background: var(--surface); border-top: 2px solid var(--edge); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 6px 0; font-size: 11px; font-weight: 500;
    color: var(--muted); border-radius: 12px; min-width: 0; }
  .tab[aria-selected="true"] { background: var(--tc); color: #10303a; font-weight: 900; }

  @media (min-width: 860px) {
    .shell { max-width: 820px; padding-bottom: 48px; }
    .hero-in { max-width: 820px; }
    .tabs { position: sticky; top: 8px; bottom: auto; border: 2px solid var(--edge); border-radius: 18px; padding: 4px; margin-bottom: 18px; box-shadow: 0 4px 0 var(--edge); }
    .tab { flex-direction: row; justify-content: center; gap: 6px; font-size: 13.5px; padding: 9px 0; }
  }

  /* ---------- Blocks ---------- */
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--surface); border: 2px solid var(--edge); border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 var(--edge); min-width: 0; position: relative; }
  .card::before { content: ""; position: absolute; left: 18px; top: -2px; width: 46px; height: 7px; border-radius: 0 0 7px 7px; background: var(--tabc, var(--primary)); }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 4px 0 10px; flex-wrap: wrap; }
  .card-h h2 { font-size: 16px; font-weight: 900; }
  .card-h .hint { font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .spread { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--line); white-space: nowrap; }
  .pill.ok { background: var(--mint-soft); color: var(--ok); border-color: transparent; }
  .pill.warn { background: var(--sun-soft); color: var(--warn); border-color: transparent; }
  .pill.bad { background: var(--coral-soft); color: var(--bad); border-color: transparent; }
  .pill.pri { background: var(--sky-soft); color: var(--ink); border-color: transparent; }
  .pill.pink { background: var(--pink-soft); color: var(--ink); border-color: transparent; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 2px solid var(--edge); background: var(--surface); border-radius: 999px; padding: 6px 15px; font-size: 13px; font-weight: 500; box-shadow: 0 3px 0 var(--edge); }
  .chip[aria-pressed="true"] { background: var(--dc, var(--sun)); font-weight: 900; color: #10303a; }
  .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--edge); background: var(--surface);
    border-radius: 12px; padding: 8px 14px; font-size: 13.5px; font-weight: 700; min-height: 40px; box-shadow: 0 3px 0 var(--edge); }
  .btn.pri { background: var(--sun); color: #10303a; }
  .btn.sm { padding: 3px 10px; min-height: 32px; font-size: 12.5px; border-radius: 10px; box-shadow: 0 2px 0 var(--edge); }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
  .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); box-shadow: none; font-weight: 500; }

  .map { display: inline-flex; align-items: center; gap: 5px; background: var(--naver); color: var(--naver-ink); font-weight: 900; font-size: 12px;
    padding: 4px 11px 4px 8px; border-radius: 999px; text-decoration: none; white-space: nowrap; border: 2px solid var(--edge); }
  .map .ic { width: 14px; height: 14px; }

  /* ---------- Forms ---------- */
  details.add { border: 2px dashed var(--edge); border-radius: 18px; background: var(--surface); }
  details.add > summary { list-style: none; cursor: pointer; padding: 12px 16px; font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
  details.add > summary::-webkit-details-marker { display: none; }
  details.add[open] > summary { border-bottom: 2px dashed var(--edge); }
  form.f { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 14px; }
  form.f .full { grid-column: 1 / -1; }
  label.fl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); min-width: 0; }
  input[type=text], input[type=number], select, textarea { width: 100%; min-width: 0; background: var(--surface-2); border: 2px solid var(--line); border-radius: 11px; padding: 8px 10px; font-size: 14px; color: var(--ink); }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { border-color: var(--edge); outline: none; }
  textarea { resize: vertical; min-height: 64px; }
  input[type=file] { font-size: 12.5px; max-width: 100%; }

  /* ---------- Overview ---------- */
  .countdown { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sticker { font-family: var(--num); font-size: 30px; font-weight: 700; line-height: 1; background: var(--sun); color: #10303a; border: 2px solid var(--edge);
    border-radius: 16px; padding: 10px 14px; transform: rotate(-3deg); box-shadow: 0 3px 0 var(--edge); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { border-radius: 14px; padding: 10px 12px; border: 2px solid var(--edge); }
  .stat:nth-child(5n+1) { background: var(--sky-soft); } .stat:nth-child(5n+2) { background: var(--sun-soft); } .stat:nth-child(5n+3) { background: var(--coral-soft); }
  .stat:nth-child(5n+4) { background: var(--mint-soft); } .stat:nth-child(5n+5) { background: var(--pink-soft); }
  .stat .l { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .stat .v { font-family: var(--num); font-size: 18px; font-weight: 700; color: var(--ink); }

  /* ---------- Stops ---------- */
  .stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .stop { display: grid; grid-template-columns: auto 74px minmax(0, 1fr); gap: 8px; padding: 12px 12px 12px 8px; background: var(--surface); border: 2px solid var(--edge); border-radius: 16px;
    box-shadow: 0 3px 0 var(--edge); transition: transform .16s ease; }
  .stop.nogrip { grid-template-columns: 74px minmax(0, 1fr); padding-left: 12px; }
  .stop.next { background: var(--dcs); }
  .stop.done .st-title { text-decoration: line-through; color: var(--muted); }
  .stop.dragging { transition: none; z-index: 5; position: relative; box-shadow: 0 10px 0 var(--edge); background: var(--sun-soft); }
  .stop.editing { grid-template-columns: minmax(0, 1fr); padding: 14px; background: var(--sky-soft); }
  .grip { width: 28px; align-self: stretch; display: grid; place-content: center; background: none; border: 0; color: var(--muted); touch-action: none; cursor: grab; border-radius: 8px; padding: 0; }
  .grip svg { width: 18px; height: 18px; }
  .st-time { font-family: var(--num); font-size: 12.5px; font-weight: 600; line-height: 1.3; align-self: start; background: var(--dcs, var(--sun-soft)); color: var(--ink); padding: 3px 8px; border-radius: 9px; text-align: center; border: 1.5px solid var(--dc, var(--line)); }
  .st-title { font-weight: 900; font-size: 14.5px; overflow-wrap: anywhere; }
  .st-line { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; margin-top: 3px; }
  .st-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; border: 2px solid var(--edge); cursor: zoom-in; }
  .chk { appearance: none; width: 24px; height: 24px; border: 2px solid var(--edge); border-radius: 8px; background: var(--surface); display: inline-grid; place-content: center; flex: none; cursor: pointer; margin: 0; }
  .chk:checked { background: var(--mint); }
  .chk:checked::after { content: ""; width: 6px; height: 11px; border: solid #10303a; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .day-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .day-head h2 { font-size: 18px; font-weight: 900; }
  .hint-drag { font-size: 12px; color: var(--muted); }

  /* ---------- Lists ---------- */
  .item { display: flex; flex-direction: column; gap: 9px; }
  .item h3 { font-size: 16px; font-weight: 900; }
  .item .ko-name { font-family: var(--font-ko); font-size: 13px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px 14px; font-size: 12.5px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .facts b { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .notebox { background: var(--sun-soft); border-radius: 12px; padding: 8px 12px; font-size: 13px; overflow-wrap: anywhere; }
  .notebox.empty-note { background: var(--surface-2); color: var(--muted); }
  .stars { display: inline-flex; gap: 2px; }
  .star { background: none; border: 0; padding: 2px; font-size: 22px; line-height: 1; color: var(--line); }
  .star.on { color: #ffb400; }

  /* ---------- Money ---------- */
  .bar-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; margin-top: 7px; }
  .bar { height: 12px; border-radius: 7px; background: var(--surface-2); border: 1.5px solid var(--edge); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--c, var(--mint)); }
  .exp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 12px 0; border-top: 2px dotted var(--line); }
  .exp:first-child { border-top: 0; }
  .exp .amt { text-align: right; font-family: var(--num); font-weight: 700; font-size: 15px; }
  .exp .orig { font-size: 11.5px; color: var(--muted); font-weight: 400; }
  .rates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

  /* ---------- Checklist ---------- */
  .ck { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 2px dotted var(--line); }
  .ck:first-of-type { border-top: 0; }
  .ck.done .ck-t { color: var(--muted); text-decoration: line-through; }
  .ck-t { font-size: 14px; overflow-wrap: anywhere; }

  /* ---------- Phrases ---------- */
  .ph { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
  .ph .kr { font-family: var(--font-ko); font-size: 21px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.35; }
  .ph .zh { font-size: 13.5px; }
  .ph .rm { font-size: 12px; color: var(--muted); font-style: italic; }
  .spk { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--edge); background: var(--pink); color: #10303a; display: grid; place-content: center; box-shadow: 0 3px 0 var(--edge); }
  .spk .ic { width: 24px; height: 24px; }
  .spk:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
  .spk.playing { background: var(--naver); }

  /* ---------- Overlay + toast ---------- */
  .ov { position: fixed; inset: 0; z-index: 50; background: rgba(8,16,20,.9); display: grid; place-items: center; padding: 20px; }
  .ov-in { max-width: 100%; max-height: 100%; overflow: auto; text-align: center; color: #fff; }
  .ov-in img { max-width: 100%; max-height: 80vh; border-radius: 14px; }
  .ov-kr { font-family: var(--font-ko); font-size: clamp(34px, 11vw, 64px); font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .ov-zh { margin-top: 14px; font-size: 18px; opacity: .85; }
  .ov .btn { margin-top: 20px; }
  #toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 700; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }

  .readonly .edit-only { display: none !important; }
  .readonly .ctl { pointer-events: none; }
  .empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 18px 0; }
  .foot { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 8px 0; }

  @media (max-width: 420px) {
    .stop { grid-template-columns: auto 62px minmax(0, 1fr); }
    .stop.nogrip { grid-template-columns: 62px minmax(0, 1fr); }
    form.f { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { #toast, .stop { transition: none; } .sticker { transform: none; } }
</style></head><body>


<header class="hero">
  <div class="hero-in">
    <div>
      <h1>釜山五日</h1>
      <div class="sub">10/9（五）– 10/13（二）· 2 人 · 廣安里</div>
    </div>
    <button class="mode" id="modeBtn" type="button" aria-pressed="true"></button>
  </div>
  <svg class="wave" viewBox="0 0 400 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12 Q25 0 50 12 T100 12 T150 12 T200 12 T250 12 T300 12 T350 12 T400 12 V24 H0Z" fill="var(--bg)"/></svg>
</header>
<div class="shell" id="shell">
  <nav class="tabs" id="tabs" role="tablist" aria-label="主要頁簽"></nav>
  <main id="view" class="stack"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="ov" id="ov" hidden><div class="ov-in" id="ovIn"></div></div>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  var ICONS = {
    overview: '<path d="M4 13h6V4H4zM14 20h6V11h-6zM14 8h6V4h-6zM4 20h6v-3H4z"/>',
    route: '<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/>',
    spot: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    food: '<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>',

    return h + '</span>';
  }

  function listItem(p, kind) {
    var isFood = kind === 'food';
    var facts = [['區域', p.area], ['營業時間', p.hours]];
    if (isFood) { facts.push(['招牌菜', p.dish]); facts.push(['價位', p.price]); }
    else { facts.push(['門票', p.ticket]); facts.push(['預估停留', p.stay]); }
    var prioCls = p.prio === 'must' ? 'bad' : p.prio === 'want' ? 'warn' : '';
    var stCls = p.status === 'done' ? 'ok' : p.status === 'sched' ? 'pri' : p.status === 'drop' ? '' : 'pink';
    var editing = S.ui.edit && S.ui.editNote === p.id;
    var noteHtml = editing ?
      '<div><textarea id="nt-' + p.id + '" aria-label="備註">' + esc(p.note) + '</textarea><div class="row" style="margin-top:8px"><button class="btn sm pri" type="button" data-act="savenote" data-kind="' + kind + '" data-id="' + p.id + '">' + ic('save') + '儲存備註</button><button class="btn sm" type="button" data-act="canceledit">取消</button></div></div>' :
      (p.note ? '<div class="notebox">' + esc(p.note) + '</div>' : '<div class="notebox empty-note edit-only">尚無備註</div>');
    return '<article class="card item"><div class="spread"><div><h3>' + esc(p.zh) + '</h3><div class="ko-name">' + esc(p.ko) + '</div></div>' +
      '<div class="row" style="justify-content:flex-end"><span class="pill ' + prioCls + '">' + PRIO[p.prio] + '</span><span class="pill ' + stCls + '">' + STAT[p.status] + '</span></div></div>' +
      '<div class="facts">' + facts.map(function (f) { return '<div><b>' + f[0] + '</b>' + (f[1] ? esc(f[1]) : '<span class="muted">未填</span>') + '</div>'; }).join('') + '</div>' +
      noteHtml +
      '<div class="row">' + mapLink(p.kw) +
      (editing ? '' : '<button class="btn sm edit-only" type="button" data-act="editnote" data-id="' + p.id + '">' + ic('edit') + '編輯備註</button>') +
      '<label class="row small edit-only" style="margin-left:auto;gap:6px">狀態<select class="ctl" data-ch="pstatus" data-kind="' + kind + '" data-id="' + p.id + '" style="width:auto">' +
      Object.keys(STAT).map(function (k) { return '<option value="' + k + '"' + (k === p.status ? ' selected' : '') + '>' + STAT[k] + '</option>'; }).join('') + '</select></label>' +
      '<label class="row small edit-only" style="gap:6px">優先度<select class="ctl" data-ch="pprio" data-kind="' + kind + '" data-id="' + p.id + '" style="width:auto">' +
      Object.keys(PRIO).map(function (k) { return '<option value="' + k + '"' + (k === p.prio ? ' selected' : '') + '>' + PRIO[k] + '</option>'; }).join('') + '</select></label></div>' +
      (p.status === 'done' ? '<div class="row">' + stars(p) + '<input type="text" class="ctl" data-ch="preview" data-kind="' + kind + '" data-id="' + p.id + '" placeholder="心得（可不填）" value="' + esc(p.review) + '" style="flex:1;min-width:140px"></div>' : '') +
      '</article>';
  }

      '<details class="add edit-only"><summary>' + ic('plus') + '新增' + (isFood ? '餐廳' : '景點') + '</summary><form class="f" data-form="' + kind + '">' +
      '<label class="fl">中文名稱<input type="text" name="zh" required></label><label class="fl">韓文名稱<input type="text" name="ko" required></label>' +

      '<label class="fl">營業時間、公休' + (isFood ? '、最後點餐' : '') + '<input type="text" name="hours"></label>' + extra +
      '<label class="fl">優先度<select name="prio"><option value="want">想去</option><option value="must">必去</option><option value="alt">備選</option></select></label>' +
      '<label class="fl full">備註<textarea name="note"></textarea></label>' +
      '<div class="full row"><button class="btn pri" type="submit">' + ic('save') + '儲存到候選</button></div></form></details>';

  function vMoney() {
    var sm = sums(), total = sm.paid + sm.est || 1;

      return Object.keys(obj).sort(function (a, b) { return obj[b] - obj[a]; }).map(function (k, i) {
        return '<div class="bar-row"><span>' + esc(k) + '</span><div class="bar"><i style="width:' + Math.max(3, obj[k] / total * 100) + '%;--c:' + COLORS[i % COLORS.length] + '"></i></div><span class="num">' + nt(obj[k]) + '</span></div>';
      }).join('');
    }
    var curTxt = Object.keys(sm.cur).map(function (c) { return c + ' ' + Math.round(sm.cur[c]).toLocaleString('en-US'); }).join(' · ');
    var list = S.expenses.slice().reverse().map(function (e) {
      var inv = MEM.inv[e.id];
      return '<div class="exp"><div><div style="font-weight:900;font-size:14px">' + esc(e.name) + (e.sample ? ' <span class="pill">範例</span>' : '') + '</div>' +
        '<div class="row" style="margin-top:4px"><span class="pill pri">' + esc(e.cat) + '</span><span class="pill pink">' + esc(e.pay) + '</span>' +

        '<div class="amt">' + nt(twd(e)) + (e.cur !== 'TWD' ? '<div class="orig">' + e.cur + ' ' + e.amt.toLocaleString('en-US') + '</div>' : '') +
        '<button class="btn sm ghost edit-only" data-act="delexp" data-id="' + e.id + '">刪除</button></div></div>';
    }).join('');
    return '<section class="card"><div class="card-h"><h2>花費總覽</h2><span class="hint">換算成台幣</span></div><div class="stats">' +
      '<div class="stat"><div class="l">已付</div><div class="v">' + nt(sm.paid) + '</div></div>' +
      '<div class="stat"><div class="l">預估</div><div class="v">' + nt(sm.est) + '</div></div>' +
      '<div class="stat"><div class="l">合計</div><div class="v">' + nt(sm.paid + sm.est) + '</div></div>' +
      '<div class="stat"><div class="l">未退稅</div><div class="v">' + nt(sm.unref) + '</div></div></div>' +
      '<div class="small muted" style="margin-top:10px">原幣別合計：' + esc(curTxt) + '</div></section>' +
      '<section class="card"><div class="card-h"><h2>依類別</h2></div>' + bars(sm.cat) + '<div class="card-h" style="margin-top:16px"><h2>依付款方式</h2></div>' + bars(sm.pay) + '</section>' +
      '<section class="card"><div class="card-h"><h2>明細</h2><span class="hint">' + S.expenses.length + ' 筆</span></div>' + list + '</section>' +
      '<details class="add edit-only"><summary>' + ic('plus') + '新增費用</summary><form class="f" data-form="exp">' +
      '<label class="fl full">項目<input type="text" name="name" required></label>' +
      '<label class="fl">金額<input type="number" name="amt" inputmode="decimal" step="any" min="0" required></label>' +
      '<label class="fl">幣別<select name="cur"><option>KRW</option><option>TWD</option><option>CNY</option></select></label>' +
      '<label class="fl">類別<select name="cat">' + CATS.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></label>' +
      '<label class="fl">付款方式<select name="pay">' + PAYS.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></label>' +
      '<label class="fl full" id="payOtherWrap" hidden>其他付款方式（手動輸入）<input type="text" name="payOther" placeholder="例：Apple Pay、T-money"></label>' +
      '<label class="fl">付款狀態<select name="status"><option value="paid" selected>已付</option><option value="est">預估</option></select></label>' +
      '<label class="fl">退稅狀態<select name="tax"><option value="done" selected>已退稅（或不需退稅）</option><option value="pending">未退稅</option></select></label>' +
      '<label class="fl full">發票圖片（可選）<input type="file" name="inv" accept="image/*"></label>' +
      '<div class="full row"><button class="btn pri" type="submit">' + ic('save') + '儲存</button><button class="btn" type="button" disabled title="雛型未啟用">辨識填入（正式版）</button></div></form>' +

      ['KRW', 'CNY'].map(function (c) { return '<label class="fl">' + c + '<input type="number" step="any" min="0" class="ctl" data-ch="rate" data-c="' + c + '" value="' + S.rates[c] + '"></label>'; }).join('') + '</div></details>' +
      '<div class="foot">雛型的發票圖片只暫存在這次開啟，重新整理後會消失；正式版才會保存。</div>';
  }

  function dueInfo(c) {
    if (!c.due || c.done) return c.due ? '<span class="small muted">' + c.due.slice(5).replace('-', '/') + '</span>' : '';
    var diff = Math.round((new Date(c.due) - new Date(todayIso())) / 86400000);
    var md = c.due.slice(5).replace('-', '/');
    if (diff < 0) return '<span class="pill bad">已逾期 ' + md + '</span>';
    if (diff <= 2) return '<span class="pill warn">' + (diff === 0 ? '今天' : diff + ' 天內') + '到期 ' + md + '</span>';
    return '<span class="small muted">' + md + ' 前</span>';
  }

  function vCheck() {
    var cats = [];
    S.checks.forEach(function (c) { if (cats.indexOf(c.cat) < 0) cats.push(c.cat); });
    var done = S.checks.filter(function (c) { return c.done; }).length;
    return '<section class="card"><div class="spread"><h2 style="font-size:16px;font-weight:900">完成進度</h2><span class="num" style="font-weight:700;font-size:20px">' + done + ' / ' + S.checks.length + '</span></div></section>' +
      cats.map(function (cat) {
        return '<section class="card"><div class="card-h"><h2>' + esc(cat) + '</h2></div>' +
          S.checks.filter(function (c) { return c.cat === cat; }).sort(function (a, b) { return (a.done - b.done) || (a.due || '9').localeCompare(b.due || '9'); }).map(function (c) {
            return '<div class="ck' + (c.done ? ' done' : '') + '"><input type="checkbox" class="chk ctl" data-ch="ck" data-id="' + c.id + '"' + (c.done ? ' checked' : '') + ' aria-label="完成"><div class="ck-t">' + esc(c.text) + '</div><div>' + dueInfo(c) + '</div></div>';
          }).join('') + '</section>';
      }).join('') +
      '<details class="add edit-only"><summary>' + ic('plus') + '新增檢查事項</summary><form class="f" data-form="ck">' +
      '<label class="fl full">事項<input type="text" name="text" required></label>' +
      '<label class="fl">類別<input type="text" name="cat" list="catlist" value="預約訂位" required><datalist id="catlist">' + cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist></label>' +
      '<label class="fl">截止日期（可不填）<input type="text" name="due" placeholder="2026-10-08"></label>' +
      '<div class="full row"><button class="btn pri" type="submit">' + ic('save') + '儲存</button></div></form></details>';
  }

  function vPhrase() {
    var cats = ['all'];
    S.phrases.forEach(function (p) { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
    var f = S.ui.phc;
    return '<div class="chips">' + cats.map(function (c) { return '<button class="chip" type="button" data-act="phcat" data-v="' + esc(c) + '" aria-pressed="' + (c === f) + '">' + (c === 'all' ? '全部' : esc(c)) + '</button>'; }).join('') + '</div>' +
      S.phrases.filter(function (p) { return f === 'all' || p.cat === f; }).map(function (p) {
        return '<section class="card ph"><div><div class="zh muted">' + esc(p.zh) + '</div><div class="kr">' + esc(p.ko) + '</div>' + (p.rm ? '<div class="rm">' + esc(p.rm) + '</div>' : '') +
          '<div class="row" style="margin-top:8px"><button class="btn sm" data-act="zoomph" data-id="' + p.id + '">' + ic('expand') + '放大給對方看</button><button class="btn sm ghost edit-only" data-act="delph" data-id="' + p.id + '">刪除</button></div></div>' +
          '<button class="spk" type="button" data-act="speak" data-id="' + p.id + '" aria-label="播放韓文發音：' + esc(p.zh) + '">' + ic('speaker') + '</button></section>';
      }).join('') +
      '<details class="add edit-only"><summary>' + ic('plus') + '新增語句</summary><form class="f" data-form="ph">' +
      '<label class="fl">中文<input type="text" name="zh" required></label><label class="fl">韓文（會用來朗讀）<input type="text" name="ko" required></label>' +

      '<div class="full row"><button class="btn pri" type="submit">' + ic('save') + '儲存</button></div></form></details>' +
      '<div class="foot">喇叭使用手機內建的韓文語音朗讀，沒有聲音時請確認音量與靜音設定。</div>';

  /* ---------- render ---------- */
  function renderTabs() {
    $('tabs').innerHTML = TABS.map(function (t) {
      return '<button class="tab" role="tab" type="button" data-tab="' + t[0] + '" style="--tc:' + t[3] + '" aria-selected="' + (S.ui.tab === t[0]) + '">' + ic(t[2]) + '<span>' + t[1] + '</span></button>';
    }).join('');
  }
  function renderMode() {
    var b = $('modeBtn');
    b.disabled = !CANWRITE;
    b.setAttribute('aria-pressed', String(S.ui.edit));
    b.innerHTML = ic(S.ui.edit ? 'edit' : 'lock') + (!CANWRITE ? '唯讀（同行者）' : S.ui.edit ? '編輯模式' : '預覽唯讀');
    $('shell').classList.toggle('readonly', !S.ui.edit);
  }
  function render() {
    S.ui.edit = PREF && CANWRITE; dirty = false;
    var v = $('view'), cur = TABS.filter(function (t) { return t[0] === S.ui.tab; })[0];
    v.style.setProperty('--tabc', cur[3]);
    if (!READY) { v.innerHTML = '<section class="card empty">載入中…</section>'; }
    else if (SYNC === 'cloud' && COLS.every(function (c) { return !S[c].length; })) {
      v.innerHTML = '<section class="card empty">雲端資料庫目前是空的。<br>' + (CANWRITE ? '請讓 Claude 匯入範例行程，或直接在各頁簽新增資料。' : '等主人建立行程後，這裡會即時出現內容。') + '</section>' + (S.ui.tab === 'overview' ? syncFoot() : '');
    } else {
      var fn = { overview: vOverview, route: vRoute, spot: function () { return vList('spot'); }, food: function () { return vList('food'); }, money: vMoney, check: vCheck, phrase: vPhrase }[S.ui.tab];
      v.innerHTML = fn();
    }
    renderTabs(); renderMode();
  }
  /* re-render caused by someone else's write; never wipe a form that is being filled in */
  function softRender() {
    var a = document.activeElement, v = $('view');
    var typing = a && v.contains(a) && a.matches('input[type=text],input[type=number],textarea');
    var open = S.ui.edit && (S.ui.editStop || S.ui.editNote || v.querySelector('details.add[open]'));
    if (drag || typing || open) { dirty = true; return; }
    render();
  }
  document.addEventListener('focusout', function () { if (dirty) setTimeout(function () { if (dirty) softRender(); }, 250); });

  /* ---------- speech ---------- */
  function speak(text, btn) {
    if (!('speechSynthesis' in window)) { toast('這支手機不支援語音朗讀'); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.85;
    var vs = window.speechSynthesis.getVoices() || [];
    var ko = vs.filter(function (x) { return x.lang && x.lang.replace('_', '-').toLowerCase().indexOf('ko') === 0; })[0];
    if (ko) u.voice = ko; else if (vs.length) toast('找不到韓文語音，可能沒有聲音');
    if (btn) { btn.classList.add('playing'); u.onend = u.onerror = function () { btn.classList.remove('playing'); }; }
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }

  function showOv(html) { $('ovIn').innerHTML = html + '<div><button class="btn" data-act="closeov" type="button">關閉</button></div>'; $('ov').hidden = false; }
  function readFile(file, cb) { var r = new FileReader(); r.onload = function () { cb(r.result); }; r.readAsDataURL(file); }

  /* ---------- drag to reorder (pointer events, transform-based so the dragged node never leaves the DOM) ---------- */
  var drag = null, scrollTimer = null;
  function dragStart(e, grip) {
    if (!S.ui.edit) return;
    var li = grip.closest('.stop'), ul = li.parentNode;
    var items = [].slice.call(ul.children), idx = items.indexOf(li);
    var sy = window.scrollY;
    var rects = items.map(function (n) { var r = n.getBoundingClientRect(); return { top: r.top + sy, h: r.height }; });
    drag = { li: li, items: items, idx: idx, to: idx, startY: e.clientY, sy: sy, rects: rects, lastY: e.clientY, pid: e.pointerId, grip: grip };
    li.classList.add('dragging');
    try { grip.setPointerCapture(e.pointerId); } catch (x) {}
    clearInterval(scrollTimer);
    scrollTimer = setInterval(function () {
      if (!drag) return;
      var y = drag.lastY, vh = window.innerHeight;
      if (y < 90) window.scrollBy(0, -12); else if (y > vh - 130) window.scrollBy(0, 12); else return;
      dragMove(null);
    }, 16);
  }
  function dragMove(e) {
    if (!drag) return;
    if (e) drag.lastY = e.clientY;
    var dy = (drag.lastY - drag.startY) + (window.scrollY - drag.sy);
    var me = drag.rects[drag.idx], gap = 10;
    drag.li.style.transform = 'translateY(' + dy + 'px)';
    var center = me.top + me.h / 2 + dy, to = drag.idx, j, mid;
    for (j = 0; j < drag.idx; j++) { mid = drag.rects[j].top + drag.rects[j].h / 2; if (center < mid) { to = j; break; } }
    for (j = drag.items.length - 1; j > drag.idx; j--) { mid = drag.rects[j].top + drag.rects[j].h / 2; if (center > mid) { to = j; break; } }
    drag.to = to;
    drag.items.forEach(function (n, k) {
      if (k === drag.idx) return;
      var sh = 0;
      if (drag.idx < to && k > drag.idx && k <= to) sh = -(me.h + gap);
      if (drag.idx > to && k < drag.idx && k >= to) sh = me.h + gap;
      n.style.transform = sh ? 'translateY(' + sh + 'px)' : '';
    });
  }
  function dragEnd() {
    if (!drag) return;
    clearInterval(scrollTimer);
    var d = drag; drag = null;
    if (d.to !== d.idx) {
      var ids = d.items.map(function (n) { return n.dataset.id; });
      var moved = ids.splice(d.idx, 1)[0]; ids.splice(d.to, 0, moved);
      reorder(S.ui.day, ids); toast('順序已更新');
    } else { render(); }
  }
  document.addEventListener('pointerdown', function (e) {
    var g = e.target.closest('[data-grip]');
    if (g) { e.preventDefault(); dragStart(e, g); }
  });
  document.addEventListener('pointermove', function (e) { if (drag) { e.preventDefault(); dragMove(e); } }, { passive: false });
  document.addEventListener('pointerup', dragEnd);
  document.addEventListener('pointercancel', dragEnd);
  document.addEventListener('keydown', function (e) {
    var g = e.target.closest && e.target.closest('[data-grip]');
    if (!g || !S.ui.edit || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    var list = dayStops(S.ui.day), i = list.findIndex(function (s) { return s.id === g.dataset.grip; }), j = e.key === 'ArrowUp' ? i - 1 : i + 1;
    if (i < 0 || j < 0 || j >= list.length) return;
    var t = list[i]; list[i] = list[j]; list[j] = t;
    reorder(S.ui.day, list.map(function (x) { return x.id; }));
    var again = document.querySelector('[data-grip="' + g.dataset.grip + '"]'); if (again) again.focus();
  });

  /* ---------- events ---------- */
  var EDIT_ACTS = { delstop: 1, delexp: 1, delph: 1, reset: 1, rate: 1, editstop: 1, editnote: 1, savenote: 1, sorttime: 1 };
  var EDIT_CH = { done: 1, att: 1, pstatus: 1, pprio: 1, preview: 1, ck: 1, rate: 1 };

  document.addEventListener('click', function (e) {
    var tb = e.target.closest('[data-tab]');
    if (tb) { S.ui.tab = tb.dataset.tab; S.ui.editStop = ''; S.ui.editNote = ''; uiCommit(); window.scrollTo(0, 0); return; }
    if (e.target.closest('#modeBtn')) {
      if (!CANWRITE) return;
      PREF = !PREF; S.ui.editStop = ''; S.ui.editNote = ''; uiCommit();
      toast(PREF ? '編輯模式' : '預覽唯讀：同行者看到的畫面'); return;
    }
    var t = e.target.closest('[data-act]');
    if (!t) { if (e.target === $('ov')) $('ov').hidden = true; return; }
    var a = t.dataset.act, id = t.dataset.id;
    if (EDIT_ACTS[a] && !S.ui.edit) return;
    if (a === 'closeov') { $('ov').hidden = true; return; }
    if (a === 'day') { S.ui.day = Number(t.dataset.i); S.ui.editStop = ''; uiCommit(); }
    else if (a === 'filter') { S.ui[t.dataset.kind === 'food' ? 'ff' : 'pf'] = t.dataset.v; uiCommit(); }
    else if (a === 'phcat') { S.ui.phc = t.dataset.v; uiCommit(); }
    else if (a === 'delstop') { del('stops', id); }
    else if (a === 'delexp') { del('expenses', id); }
    else if (a === 'delph') { del('phrases', id); }
    else if (a === 'editstop') { S.ui.editStop = id; render(); var f = document.querySelector('form[data-id="' + id + '"] input[name=time]'); if (f) f.focus(); }
    else if (a === 'editnote') { S.ui.editNote = id; render(); var ta = $('nt-' + id); if (ta) ta.focus(); }
    else if (a === 'canceledit') { S.ui.editStop = ''; S.ui.editNote = ''; render(); }
    else if (a === 'savenote') {
      var ta2 = $('nt-' + id);
      if (ta2) { S.ui.editNote = ''; patch(t.dataset.kind === 'food' ? 'foods' : 'places', id, { note: ta2.value.trim() }).then(function () { render(); toast('備註已儲存'); }); }
    }
    else if (a === 'sorttime') {
      var l = dayStops(S.ui.day).slice().sort(function (x, y) { return x.time.slice(0, 5).localeCompare(y.time.slice(0, 5)); });
      reorder(S.ui.day, l.map(function (x) { return x.id; })); toast('已依時間排序');
    }
    else if (a === 'rate') { var p = find(S.places, id) || find(S.foods, id); if (p) patch(collOf(id), id, { rating: (p.rating === Number(t.dataset.n)) ? 0 : Number(t.dataset.n) }); }
    else if (a === 'speak') { var ph = find(S.phrases, id); if (ph) speak(ph.ko, t); }
    else if (a === 'zoomph') { var q = find(S.phrases, id); if (q) showOv('<div class="ov-kr">' + esc(q.ko) + '</div><div class="ov-zh">' + esc(q.zh) + '</div>'); }
    else if (a === 'zoomimg') {
      var k = t.dataset.src.split(':'), src = k[0] === 'inv' ? MEM.inv[k[1]] : (MEM.att[k[0]] || [])[Number(k[1])];
      if (src) showOv('<img src="' + src + '" alt="附件放大">');
    }
    else if (a === 'reset' && !CLOUD) { var d0 = withOrd(seed()); loadInto(d0); MEM = { att: {}, inv: {} }; saveLocal(); render(); toast('已重設為範例資料'); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'sim') { S.ui.sim = t.value; uiCommit(); return; }
    if (t.name === 'pay' && t.form) { var w = $('payOtherWrap'); if (w) w.hidden = t.value !== '其他'; return; }
    var c = t.dataset.ch; if (!c) return;
    if (EDIT_CH[c] && !S.ui.edit) { render(); return; }
    var id = t.dataset.id;
    if (c === 'done') patch('stops', id, { done: t.checked });
    else if (c === 'ck') patch('checks', id, { done: t.checked });
    else if (c === 'pstatus') patch(t.dataset.kind === 'food' ? 'foods' : 'places', id, { status: t.value });
    else if (c === 'pprio') patch(t.dataset.kind === 'food' ? 'foods' : 'places', id, { prio: t.value });
    else if (c === 'preview') patch(t.dataset.kind === 'food' ? 'foods' : 'places', id, { review: t.value });
    else if (c === 'rate') { var v = parseFloat(t.value); if (v > 0) setRate(t.dataset.c, v).then(function () { toast('匯率已更新'); }); }
    else if (c === 'att') {
      var f = t.files && t.files[0]; if (!f) return;
      readFile(f, function (u) { (MEM.att[id] = MEM.att[id] || []).push(u); render(); toast('已加入附件（暫存，重新整理後消失）'); });
    }
  });

  document.addEventListener('submit', function (e) {
    var form = e.target.closest('form[data-form]'); if (!form) return;
    e.preventDefault();
    if (!S.ui.edit) return;
    var k = form.dataset.form, fd = new FormData(form), g = function (n) { return (fd.get(n) || '').toString().trim(); };
    var fin = function (msg) { return function () { render(); toast(msg); }; };
    var nextOrd = function (d) { return dayStops(d).reduce(function (m, s) { return Math.max(m, s.ord || 0); }, -1) + 1; };
    if (k === 'stop') {
      put('stops', { id: uid(), day: S.ui.day, time: g('time'), title: g('title'), kw: g('kw'), tr: g('tr'), rsv: g('rsv'), note: g('note'), done: false, ord: nextOrd(S.ui.day) }).then(fin('已儲存'));
    } else if (k === 'editstop') {
      var s = find(S.stops, form.dataset.id); if (!s) return;
      var nd = Number(g('day')), f = { time: g('time'), title: g('title'), kw: g('kw'), tr: g('tr'), rsv: g('rsv'), note: g('note'), day: nd };
      if (nd !== s.day) f.ord = nextOrd(nd);
      S.ui.editStop = '';
      patch('stops', s.id, f).then(fin(nd !== s.day ? '已儲存，並移到 ' + DAYS[nd].label : '已儲存'));
    } else if (k === 'pool') {
      var p = find(S.places, g('pid')) || find(S.foods, g('pid')); if (!p) return;
      var pc = collOf(p.id);
      put('stops', { id: uid(), day: S.ui.day, time: g('time'), title: p.zh, kw: p.kw || p.ko, tr: '', rsv: 'none', note: p.note || '', done: false, ord: nextOrd(S.ui.day) })
        .then(function () { return patch(pc, p.id, { status: 'sched' }); }).then(fin('已排入 ' + DAYS[S.ui.day].label + '，候選池狀態改為「已排入」'));
    } else if (k === 'spot' || k === 'food') {
      var o = { id: uid(), zh: g('zh'), ko: g('ko'), kw: g('kw') || g('ko'), area: g('area'), hours: g('hours'), prio: g('prio'), status: 'cand', rating: 0, note: g('note'), review: '', ord: Date.now() };
      if (k === 'food') { o.dish = g('dish'); o.price = g('price'); } else { o.ticket = g('ticket'); o.stay = g('stay'); }
      put(k === 'food' ? 'foods' : 'places', o).then(fin('已儲存'));
    } else if (k === 'exp') {
      var pay = g('pay') === '其他' ? (g('payOther') || '其他') : g('pay');
      var ex = { id: uid(), name: g('name'), amt: parseFloat(g('amt')) || 0, cur: g('cur'), cat: g('cat'), pay: pay, status: g('status'), tax: g('tax'), ord: Date.now() };
      var file = form.querySelector('input[type=file]').files[0];
      var go = function () { put('expenses', ex).then(fin('已儲存')); };
      if (file) readFile(file, function (u) { MEM.inv[ex.id] = u; go(); }); else go();
    } else if (k === 'ck') {
      put('checks', { id: uid(), cat: g('cat'), text: g('text'), due: g('due'), done: false, ord: Date.now() }).then(fin('已儲存'));
    } else if (k === 'ph') {
      put('phrases', { id: uid(), cat: g('cat'), zh: g('zh'), ko: g('ko'), rm: g('rm'), ord: Date.now() }).then(fin('已儲存'));
    }
  });

  /* ---------- start-up ---------- */
  function withOrd(d) { COLS.forEach(function (c) { (d[c] || []).forEach(function (x, i) { if (x.ord === undefined) x.ord = i; }); }); return d; }
  function startLocal() {
    SYNC = 'local'; CANWRITE = true; CLOUD = null;
    var l = rd(LKEY); loadInto(l && l.v === 3 ? withOrd(l) : withOrd(seed()));
    if (!(l && l.v === 3)) saveLocal();
    READY = true; render();
  }
  function startCloud() {
    var first = {}, need = COLS.length + 1;
    var got = function (k) { first[k] = 1; if (!READY && Object.keys(first).length >= need) { READY = true; } if (Object.keys(first).length >= need) SYNC = 'cloud'; };
    var onErr = function (e) { SYNC = 'error'; READY = true; toast('雲端資料讀取失敗（' + ((e && e.code) || '未知') + '）'); render(); };
    COLS.forEach(function (c) {
      CLOUD.collection(c).onSnapshot(function (snap) {
        S[c] = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; }).sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
        got(c); saveCache(); softRender();
      }, onErr);
    });
    CLOUD.doc('meta/settings').onSnapshot(function (snap) {
      var d = snap.exists ? snap.data() : null;
      S.rates = Object.assign({}, RATES0, (d && d.rates) || {});
      got('meta'); saveCache(); softRender();
    }, onErr);
    setTimeout(function () { if (!READY) { READY = true; softRender(); } }, 6000);
  }
  function init() {
    render();
    var cl = window.claude;
    if (!cl || !cl.use) { startLocal(); return; }
    cl.use('db').then(function (db) {
      if (!db) { if (SYNC === 'cache') { /* signed out but has cache: keep read-only cache */ SYNC = 'local'; } startLocal(); return null; }
      CLOUD = db;
      return cl.use('user').then(function (u) { USER = u; if (!u) return false; return u.can('data.write').then(function (w) { return w === null ? u.canEdit() : w; }); })
        .catch(function () { return false; })
        .then(function (w) { CANWRITE = !!w; startCloud(); render(); });
    }).catch(function () { startLocal(); });
  }

  if ('speechSynthesis' in window) { try { window.speechSynthesis.getVoices(); } catch (e) {} }
  SYNC = 'snapshot'; CANWRITE = false; CLOUD = null; loadInto(SNAP); READY = true;
  document.querySelector('.hero .sub').insertAdjacentHTML('beforeend', '<br>快照版 · 資料截至 ' + SNAP_AT);
  render();
})();
</script>
